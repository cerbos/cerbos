---
name: Test Lambda Function Publishing
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test version (e.g., v1.0.0-test)"
        required: false
        default: "v0.0.0-test"
        type: string
      arch:
        description: "Architecture to test"
        required: false
        default: "arm64"
        type: choice
        options:
          - arm64
          - amd64

jobs:
  buildBinaries:
    name: Release Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        uses: $/.github/actions/free-disk-space

      - name: Install Go and restore cached dependencies
        uses: $/.github/actions/setup-go
        with:
          cross_compiling: true

      - name: Install tools
        uses: cerbos/actions/install-tools@3b65c15c153c9bbfab65116b25692065e3f6a91e # main
        with:
          tools: |-
            goreleaser
            syft

      - name: GoReleaser
        run: goreleaser build --config=.goreleaser.yml --snapshot --id cerbos-aws-lambda-ext --id cerbos-aws-lambda-func --clean
        env:
          TELEMETRY_WRITE_KEY: ${{ secrets.TELEMETRY_WRITE_KEY }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts
          path: dist/

  testPublishLambdaFunction:
    name: Test Publish AWS Lambda Function to SAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: buildBinaries
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true

      - name: Install just
        uses: cerbos/actions/install-tools@3b65c15c153c9bbfab65116b25692065e3f6a91e # main
        with:
          tools: just

      - name: Test Lambda function publishing
        run: |
          export AWS_REGION="${VARS_AWS_REGION}"
          just -f deploy/awslambda/function/.justfile publish-to-sar "${GITHUB_EVENT_INPUTS_VERSION}" "${{ secrets.AWS_SAR_PUBLISHING_BUCKET }}" "${GITHUB_EVENT_INPUTS_ARCH}"
        env:
          VARS_AWS_REGION: ${{ vars.AWS_REGION }}
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
          GITHUB_EVENT_INPUTS_ARCH: ${{ github.event.inputs.arch }}

      - name: Test Lambda extension publishing
        run: |
          export AWS_REGION="${VARS_AWS_REGION}"
          just -f deploy/awslambda/extension/.justfile publish-to-sar "${GITHUB_EVENT_INPUTS_VERSION}" "${{ secrets.AWS_SAR_PUBLISHING_BUCKET }}" "${GITHUB_EVENT_INPUTS_ARCH}"
        env:
          VARS_AWS_REGION: ${{ vars.AWS_REGION }}
          GITHUB_EVENT_INPUTS_VERSION: ${{ github.event.inputs.version }}
          GITHUB_EVENT_INPUTS_ARCH: ${{ github.event.inputs.arch }}
