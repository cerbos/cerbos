# yaml-language-server: $schema=../../../../../schema/jsonschema/cerbos/policy/v1/Policy.schema.json
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: payslip
  rules:
    - actions:
        - view
      roles:
        - user
      effect: EFFECT_ALLOW
    # Conditional, so that the principal policy test in engine/case_58.yaml catches a shared
    # condition result whichever of its rules is evaluated first.
    - actions:
        - view
      roles:
        - clerk
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: R.attr.shared == true
