# yaml-language-server: $schema=../../../../../../schema/jsonschema/cerbos/policy/v1/Policy.schema.json
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: cel_errors.wallet
  version: default
  importDerivedRoles:
    - cel_errors.variable_roles
  rules:
    - actions:
        - view
      roles:
        - user
      effect: EFFECT_ALLOW

    - actions:
        - view
      derivedRoles:
        - spender
      effect: EFFECT_DENY
