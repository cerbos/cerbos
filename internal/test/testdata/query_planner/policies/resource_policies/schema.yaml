# yaml-language-server: $schema=../../../../../../schema/jsonschema/cerbos/policy/v1/Policy.schema.json
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: schema
  version: default
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource.json
  rules:
    - actions:
        - validate
      roles:
        - developer
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: R.attr.harmless == "mostly"
