# yaml-language-server: $schema=../../../../../../schema/jsonschema/cerbos/policy/v1/Policy.schema.json
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: deny_only
  rules:
    - actions: ["view", "edit", "delete"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: R.attr.confidential == true
