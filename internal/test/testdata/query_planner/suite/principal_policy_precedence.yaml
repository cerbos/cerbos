# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Principal policy deny should take precedence

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: User
  policyVersion: default
  roles:
    - user
  attr:
    isActive: false

tests:
  - resource:
      kind: baseResource
      policyVersion: default
    action: GET
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        GET: ""

  - resource:
      kind: baseResource
      policyVersion: default
    action: POST
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        POST: ""
