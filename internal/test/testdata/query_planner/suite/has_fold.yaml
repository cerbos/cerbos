# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
# These tests pin the current behaviour of the planner, which folds every has() on an unknown
# attribute to the constant true. Several of the expected plans diverge from CheckResources for
# a resource where the attribute is absent; those are marked "DIVERGES" and are expected to change
# when the fold is fixed.
description: has() folding on unknown resource attributes

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: adam
  policyVersion: default
  roles:
    - user

tests:
  # DIVERGES: check denies a resource without owner.
  - resource:
      kind: has_fold
      policyVersion: default
    action: lone_allow
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        lone_allow: ""

  # Over-denies a resource without owner, which is safe.
  - resource:
      kind: has_fold
      policyVersion: default
    action: lone_deny
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        lone_deny: ""

  # Under-grants a resource without owner, which is safe.
  - resource:
      kind: has_fold
      policyVersion: default
    action: negated_allow
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        negated_allow: ""

  # DIVERGES: the DENY rule is dropped, so a resource without owner is allowed while check denies it.
  - resource:
      kind: has_fold
      policyVersion: default
    action: negated_deny
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        negated_deny: ""

  # DIVERGES: check denies a resource with neither a nor b.
  - resource:
      kind: has_fold
      policyVersion: default
    action: or_presence
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        or_presence: ""

  # DIVERGES: check denies a resource with b == 1 but without a.
  - resource:
      kind: has_fold
      policyVersion: default
    action: guard_other_field
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.b
              - value: 1
      matchedScopes:
        guard_other_field: ""

  # The condition folds to true but the if is not simplified away.
  - resource:
      kind: has_fold
      policyVersion: default
    action: ternary
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: if
            operands:
              - value: true
              - expression:
                  operator: eq
                  operands:
                    - value: a
                    - variable: request.resource.attr.x
              - value: false
      matchedScopes:
        ternary: ""

  # Baseline: has() guards an access to the same field, which is what the fold is designed for.
  - resource:
      kind: has_fold
      policyVersion: default
    action: guard_same_field
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.owner
              - value: adam
      matchedScopes:
        guard_same_field: ""
