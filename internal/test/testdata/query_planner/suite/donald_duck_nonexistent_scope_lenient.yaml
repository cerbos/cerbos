# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Donald duck tests with lenient scope search

config:
  lenientScopeSearch:
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: donald_duck
  policyVersion: default
  scope: nonexistent_principal
  roles:
    - employee
    - user

tests:
  - resource:
      kind: contact
      policyVersion: default
    action: read
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        read: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: view
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: not
                  operands:
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.owner
                          - value: mickey_mouse
              - expression:
                  operator: or
                  operands:
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.dev_record
                          - value: true
                    - expression:
                        operator: and
                        operands:
                          - expression:
                              operator: not
                              operands:
                                - variable: request.resource.attr.hidden_from_employee
                          - expression:
                              operator: eq
                              operands:
                                - variable: request.resource.attr.owner
                                - value: donald_duck
      matchedScopes:
        view: ""
