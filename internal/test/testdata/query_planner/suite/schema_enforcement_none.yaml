# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Schema enforcement - none

config:
  lenientScopeSearch:
    - false
    - true

  schemaEnforcement:
    - ENFORCEMENT_NONE

  strictEvaluation:
    - false
    - true

principal:
  id: andy
  roles:
    - developer
  attr:
    power: 0.5

tests:
  - resource:
      kind: schema
      attr:
        answer: yes
    action: validate
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.harmless
              - value: mostly
      matchedScopes:
        validate: ""

  - resource:
      kind: schema
    action: validate
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.harmless
              - value: mostly
      matchedScopes:
        validate: ""
