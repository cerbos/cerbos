# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Maggie tests

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: maggie
  policyVersion: default
  roles:
    - employee
    - manager
  attr:
    geography: US
    managed_geographies:
      - US
      - CA

auxData:
  jwt:
    customInt: 42

tests:
  - resource:
      kind: leave_request
      policyVersion: default
    action: approve:refer-derived-role
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: and
                  operands:
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.status
                          - value: PENDING_APPROVAL
                    - expression:
                        operator: ne
                        operands:
                          - variable: request.resource.attr.owner
                          - value: maggie
              - expression:
                  operator: or
                  operands:
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.geography
                          - value: US
                    - expression:
                        operator: in
                        operands:
                          - variable: request.resource.attr.geography
                          - value:
                              - US
                              - CA
      matchedScopes:
        approve:refer-derived-role: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: report:allow-deny-deny
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: not
            operands:
              - expression:
                  operator: or
                  operands:
                    - variable: request.resource.attr.deleted
                    - variable: request.resource.attr.hidden
      matchedScopes:
        report:allow-deny-deny: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: report:allow-deny
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: not
            operands:
              - variable: request.resource.attr.deleted
      matchedScopes:
        report:allow-deny: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: approve:true-in-both-or-and-conditions
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.status
                    - value: PENDING_APPROVAL
              - expression:
                  operator: ne
                  operands:
                    - variable: request.resource.attr.owner
                    - value: maggie
      matchedScopes:
        approve:true-in-both-or-and-conditions: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: approve:allow-allow-deny
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: not
                  operands:
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.owner
                          - value: maggie
              - expression:
                  operator: or
                  operands:
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.status
                          - value: PENDING_APPROVAL
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.geography
                          - value: US
      matchedScopes:
        approve:allow-allow-deny: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: approve:allow-allow
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: or
            operands:
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.status
                    - value: PENDING_APPROVAL
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.geography
                    - value: US
      matchedScopes:
        approve:allow-allow: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: approve:allow-deny
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: not
                  operands:
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.owner
                          - value: maggie
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.status
                    - value: PENDING_APPROVAL
      matchedScopes:
        approve:allow-deny: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: approve:false-in-and-condition
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        approve:false-in-and-condition: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: enlist:none-condition
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: not
                  operands:
                    - expression:
                        operator: in
                        operands:
                          - variable: request.resource.attr.team
                          - value:
                              - A
                              - B
              - expression:
                  operator: not
                  operands:
                    - expression:
                        operator: lt
                        operands:
                          - variable: request.resource.attr.GPA
                          - value: 4.7
      matchedScopes:
        enlist:none-condition: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: approve:with-jwt
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.groupID
              - value: 42
      matchedScopes:
        approve:with-jwt: ""

  - resource:
      kind: leave_request
      policyVersion: default
      attr:
        geography: US
    action: approve:refer-derived-role
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.status
                    - value: PENDING_APPROVAL
              - expression:
                  operator: ne
                  operands:
                    - variable: request.resource.attr.owner
                    - value: maggie
      matchedScopes:
        approve:refer-derived-role: ""

  - resource:
      kind: leave_request
      policyVersion: default
      attr:
        geography: US
    action: approve
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.status
                    - value: PENDING_APPROVAL
              - expression:
                  operator: ne
                  operands:
                    - variable: request.resource.attr.owner
                    - value: maggie
      matchedScopes:
        approve: ""

  - resource:
      kind: leave_request
      policyVersion: default
      attr:
        geography: US
        owner: brian
    action: approve
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.status
              - value: PENDING_APPROVAL
      matchedScopes:
        approve: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: approve:non-boolean-condition
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        approve:non-boolean-condition: ""
