# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Default policy version

config:
  defaultPolicyVersion: "2025_11"
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: alice
  roles:
    - user

tests:
  - resource:
      kind: additive
      scope: acme.hr
    action: read
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        read: acme.hr
