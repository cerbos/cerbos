# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Reference to missing attr in variable

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false

principal:
  id: adam
  policyVersion: default
  roles:
    - user
  attr:
    email: info@example.com
    org: org-1

tests:
  - resource:
      kind: missing_attr
      policyVersion: default
    action: use
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      evaluationErrors:
        - celError:
            expression: V.eng && P.attr.org == "org-1"
            message: "no such key: is_engineer"
      matchedScopes:
        use: ""
