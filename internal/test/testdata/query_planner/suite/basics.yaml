# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Basics tests

config:
  globals:
    environment: test
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: user123
  policyVersion: default
  roles:
    - USER
  attr:
    userQid: z0

now: "2024-01-16T10:18:27.395+13:00"

tests:
  - resource:
      kind: x
      policyVersion: default
    action: write
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - value: z0
              - variable: request.resource.id
      matchedScopes:
        write: ""

  - resource:
      kind: x
      policyVersion: default
    action: edit
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - value: z0
              - variable: request.resource.id
      matchedScopes:
        edit: ""

  - resource:
      kind: x
      policyVersion: default
    action: reference_globals
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.environment
              - value: test
      matchedScopes:
        reference_globals: ""

  - resource:
      kind: x
      policyVersion: default
    action: now-once
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        now-once: ""

  - resource:
      kind: x
      policyVersion: default
    action: lecture
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        lecture: ""

  - resource:
      kind: x
      policyVersion: default
    actions:
      - write
      - edit
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - value: z0
              - variable: request.resource.id
      matchedScopes:
        write: ""
        edit: ""

  - resource:
      kind: x
      policyVersion: default
    actions:
      - write
      - edit
      - now-once
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - value: z0
              - variable: request.resource.id
      matchedScopes:
        write: ""
        edit: ""
        now-once: ""

  - resource:
      kind: x
      policyVersion: default
    actions:
      - edit
      - reference_globals
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: eq
                  operands:
                    - value: z0
                    - variable: request.resource.id
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.environment
                    - value: test
      matchedScopes:
        edit: ""
        reference_globals: ""

  - resource:
      kind: x
      policyVersion: default
    actions:
      - edit
      - reference_globals
      - lecture
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        edit: ""
        reference_globals: ""
        lecture: ""
