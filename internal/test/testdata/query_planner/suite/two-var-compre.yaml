
# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Role policies tax return tests for emma

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
    id: mark
    policyVersion: default
    roles:
        - employee

tests:
    - action: all
      resource:
        kind: two-var-compre
        policyVersion: default
      want:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: all
            operands:
              - variable: request.resource.attr.deps
              - expression:
                  operator: lambda
                  operands:
                    - expression:
                        operator: ne
                        operands:
                          - variable: k
                          - variable: v
                    - variable: k
                    - variable: v
