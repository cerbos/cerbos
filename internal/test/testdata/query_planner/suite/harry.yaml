# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Harry tests

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: harry
  policyVersion: default
  roles:
    - employee
    - ex_intern
    - user
  attr:
    teams:
      team1: employee
      team2: user
    account_id: abc123

tests:
  - resource:
      kind: leave_request
      policyVersion: default
    action: view
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: not
                  operands:
                    - variable: request.resource.attr.hidden_from_employee
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.owner
                    - value: harry
      matchedScopes:
        view: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: view:refer-derived-role-no-condition
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.owner
              - value: harry
      matchedScopes:
        view:refer-derived-role-no-condition: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: view:refer-parent-and-derived-roles
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.owner
              - value: harry
      matchedScopes:
        view:refer-parent-and-derived-roles: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: view:refer-derived-role
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.owner
              - value: harry
      matchedScopes:
        view:refer-derived-role: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: non-existent-action
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        non-existent-action: ""

  - resource:
      kind: non-existent-resource
      policyVersion: default
    action: some-action
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        some-action: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: map-membership
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: in
            operands:
              - variable: request.resource.attr.teamId
              - value:
                  - team1
                  - team2
      matchedScopes:
        map-membership: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: map-exists
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: or
            operands:
              - expression:
                  operator: eq
                  operands:
                    - value: team1
                    - variable: request.resource.attr.teamId
              - expression:
                  operator: eq
                  operands:
                    - value: team2
                    - variable: request.resource.attr.teamId
      matchedScopes:
        map-exists: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: map-all
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: startsWith
                  operands:
                    - value: team1
                    - variable: request.resource.attr.teamId
              - expression:
                  operator: startsWith
                  operands:
                    - value: team2
                    - variable: request.resource.attr.teamId
      matchedScopes:
        map-all: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: just-index
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: in
            operands:
              - value: abc123
              - expression:
                  operator: map
                  operands:
                    - variable: request.resource.attr.accounts_people
                    - expression:
                        operator: lambda
                        operands:
                          - variable: ap.account_id
                          - variable: ap
      matchedScopes:
        just-index: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: multi-role-test
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        multi-role-test: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: multi-role-test-conditional-allow
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.owner
              - value: harry
      matchedScopes:
        multi-role-test-conditional-allow: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: multi-role-test-conditional-deny
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        multi-role-test-conditional-deny: ""

  - resource:
      kind: leave_request
      policyVersion: default
    action: multi-role-test-conditional-allow-deny
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: and
            operands:
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.owner
                    - value: harry
              - expression:
                  operator: not
                  operands:
                    - expression:
                        operator: eq
                        operands:
                          - variable: request.resource.attr.owner
                          - value: harry
      matchedScopes:
        multi-role-test-conditional-allow-deny: ""
