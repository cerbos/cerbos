# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Role policies tax return tests for x002

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: x002
  policyVersion: default
  roles:
    - employee
    - bookkeeper

tests:
  # not allowed in `bookkeeper`
  - action: reference
    resource:
      kind: tax_return
      scope: acme.finance
      policyVersion: default
    want:
      kind: KIND_ALWAYS_DENIED

  # allowed in `bookkeeper`, not allowed in parent scopes for narrowed role. not allowed for non-narrowed role
  - action: comment
    resource:
      kind: tax_return
      scope: acme.finance
      policyVersion: default
    want:
      kind: KIND_ALWAYS_DENIED

  # allowed in parent scope for non-narrowed role
  - action: view
    resource:
      kind: tax_return
      scope: acme.finance
      policyVersion: default
    want:
      kind: KIND_ALWAYS_ALLOWED

  # allowed in `bookkeeper`, allowed in parent scopes for narrowed role
  - action: create
    resource:
      kind: tax_return
      scope: acme.finance
      policyVersion: default
    want:
      kind: KIND_ALWAYS_ALLOWED
