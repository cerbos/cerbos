# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
# When the resource policy has only DENY rules for the principal's role and the requested action, it never
# allows that action on its own, even if it has ALLOW rules for other roles or actions. A principal policy
# ALLOW must not be ORed with "NOT deny condition".
description: Resource policy with only DENY rules for a role and action combined with a principal policy ALLOW

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: deny_only_user
  policyVersion: default
  roles:
    - user

tests:
  - resource:
      kind: deny_only
      policyVersion: default
    action: view
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.public
              - value: true
      matchedScopes:
        view: ""

  # An unconditional principal ALLOW takes precedence over the resource DENY
  - resource:
      kind: deny_only
      policyVersion: default
    action: edit
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        edit: ""

  # No principal rule, so the result is DENY whatever the attributes
  - resource:
      kind: deny_only
      policyVersion: default
    action: delete
    want:
      filter:
        kind: KIND_ALWAYS_DENIED
      matchedScopes:
        delete: ""

  # The resource policy has ALLOWs for other roles and actions but only a DENY for user/view
  - resource:
      kind: deny_only_mixed
      policyVersion: default
    action: view
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.public
              - value: true
      matchedScopes:
        view: ""

  # user/edit has a resource ALLOW, so the resource DENY applies on top of it
  - resource:
      kind: deny_only_mixed
      policyVersion: default
    action: edit
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: not
            operands:
              - expression:
                  operator: eq
                  operands:
                    - variable: request.resource.attr.confidential
                    - value: true
      matchedScopes:
        edit: ""
