# yaml-language-server: $schema=../../.jsonschema/QueryPlannerTestSuite.schema.json
---
description: Ensure permissions from unrestricted roles do not leak into restricted roles

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

principal:
  id: user_mixed_roles
  policyVersion: default
  roles:
    - role_viewer_unrestricted
    - acme_role_deleter_restricted

tests:
  - resource:
      kind: mixed_restrictions_res
      scope: umbrellacorp
      policyVersion: default
    action: view
    want:
      filter:
        kind: KIND_ALWAYS_ALLOWED
      matchedScopes:
        view: ""

  - resource:
      kind: mixed_restrictions_res
      scope: umbrellacorp
      policyVersion: default
    action: delete
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.safe_to_delete
              - value: true
      matchedScopes:
        delete: ""

  - resource:
      kind: mixed_restrictions_res
      scope: umbrellacorp
      policyVersion: default
    actions:
      - view
      - delete
    want:
      filter:
        kind: KIND_CONDITIONAL
        condition:
          expression:
            operator: eq
            operands:
              - variable: request.resource.attr.safe_to_delete
              - value: true
      matchedScopes:
        view: ""
        delete: ""
