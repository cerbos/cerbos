# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Error evaluating output

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: bad-output
    actions:
      - error
    principal:
      id: john
      roles:
        - employee
    resource:
      kind: equipment_request
      id: equipment_request_1
      attr:
        ownerId: john

wantOutputs: &outputs
  - requestId: bad-output
    resourceId: equipment_request_1
    effectiveDerivedRoles:
      - any_employee
    actions:
      error:
        effect: EFFECT_ALLOW
        policy: resource.equipment_request.vdefault
    outputs:
      - src: "resource.equipment_request.vdefault#output-error"
        action: error
        error: division by zero

wantDecisionLogs:
  - auditTrail:
      effectivePolicies:
        resource.equipment_request.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_07.yaml
    policySource:
      disk: {}
    checkResources:
      inputs: *inputs
      outputs: *outputs
