# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: "Scoped policy: strict scope search"

config:
  lenientScopeSearch:
    - false
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - create
      - delete
      - view:public
    principal:
      id: john
      roles:
        - employee
      attr:
        department: marketing
        geography: GB
        team: design
        ip_address: 10.20.0.13
    resource:
      kind: leave_request
      scope: acme.hr.uk.wales.cardiff
      id: XX125
      attr:
        department: marketing
        geography: GB
        id: XX125
        owner: john
        team: design

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      view:public:
        effect: EFFECT_DENY
        policy: NO_MATCH
      delete:
        effect: EFFECT_DENY
        policy: NO_MATCH
      create:
        effect: EFFECT_DENY
        policy: NO_MATCH

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail: {}
    policySource:
      disk: {}
