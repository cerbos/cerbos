# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: runtime.effectiveDerivedRoles

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - camelCase
      - snake_case
    principal:
      id: andy
      roles:
        - employee
    resource:
      kind: runtime_effective_derived_roles
      id: test

wantOutputs: &outputs
  - requestId: test
    resourceId: test
    effectiveDerivedRoles:
      - one
      - two
    actions:
      camelCase:
        effect: EFFECT_ALLOW
        policy: resource.runtime_effective_derived_roles.vdefault
      snake_case:
        effect: EFFECT_ALLOW
        policy: resource.runtime_effective_derived_roles.vdefault
    outputs:
      - src: "resource.runtime_effective_derived_roles.vdefault#camelCase"
        val:
          - one
          - two
        action: camelCase
      - src: "resource.runtime_effective_derived_roles.vdefault#snake_case"
        val:
          - one
          - two
        action: snake_case

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.runtime_effective_derived_roles.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_14.yaml
    policySource:
      disk: {}
