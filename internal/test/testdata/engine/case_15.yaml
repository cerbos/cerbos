# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Wildcard roles

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - view
    principal:
      id: john
      roles:
        - employee
      attr: {}
    resource:
      policyVersion: "20210210"
      kind: leave_request
      id: XX125
      attr:
        public: true

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    effectiveDerivedRoles:
      - any_employee
    actions:
      view:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.v20210210
    evaluationErrors:
      - celError:
          expression: R.attr.owner == P.id
          message: "no such key: owner"

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.leave_request.v20210210:
          attributes:
            driver: disk
            source: resource_policies/policy_01.yaml
    policySource:
      disk: {}
