# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Resource policy with REQUIRE_PARENTAL_CONSENT_FOR_ALLOWS, leaf skipped

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      # allowed for admin in the parent scope, allow
      - move
    principal:
      id: x001
      roles:
        - admin
        - employee
    resource:
      kind: calendar_entry
      id: XX125
      scope: acme.sales

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      move:
        effect: EFFECT_ALLOW
        policy: resource.calendar_entry.vdefault/acme.sales
        scope: acme

wantDecisionLogs:
  - peer: {}
    checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.calendar_entry.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_17.yaml
        resource.calendar_entry.vdefault/acme:
          attributes:
            driver: disk
            source: resource_policies/policy_17.acme.yaml
    policySource:
      disk: {}
