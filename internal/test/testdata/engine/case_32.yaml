description: No resource policy rules

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - party_plan
