# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Role policy versions

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
  strictEvaluation:
    - false

inputs: &inputs
  - requestId: test
    actions:
      - view
      - create
    principal:
      id: john
      roles:
        - 20210210_admin
    resource:
      kind: leave_request
      id: XX125
      policyVersion: "20210210"

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      view:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.v20210210
      create:
        effect: EFFECT_DENY
        policy: role.20210210_admin.v20210210
    evaluationErrors:
      - celError:
          expression: request.resource.attr.public == true
          message: "no such key: public"

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.leave_request.v20210210:
          attributes:
            driver: disk
            source: resource_policies/policy_01.yaml
        role.20210210_admin.v20210210:
          attributes:
            driver: disk
            source: role_policies/policy_07.yaml
    policySource:
      disk: {}
