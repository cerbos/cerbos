# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Principal policy special resource kind chars

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - cast
    principal:
      id: frodo
      scope: ""
      roles:
        - fellowship
    resource:
      kind: the:one:ring
      id: XX125

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      cast:
        effect: EFFECT_ALLOW
        policy: principal.frodo.vdefault
        scope: ""

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        principal.frodo.vdefault:
          attributes:
            driver: disk
            source: principal_policies/policy_07.yaml
    policySource:
      disk: {}
