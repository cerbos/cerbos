# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: "Scoped policy: first match wins (employee can delete their own request)"

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - create
      - delete
      - view:public
    principal:
      id: john
      roles:
        - employee
      attr:
        department: marketing
        geography: GB
        team: design
        ip_address: 10.20.0.13
    resource:
      kind: leave_request
      scope: acme.hr.uk
      id: XX125
      attr:
        department: marketing
        geography: GB
        id: XX125
        owner: john
        team: design

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      view:public:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr.uk
        scope: acme.hr
      delete:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr.uk
        scope: acme.hr.uk
      create:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr.uk
        scope: acme
    effectiveDerivedRoles:
      - any_employee
      - employee_that_owns_the_record

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.leave_request.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_05.yaml
        resource.leave_request.vdefault/acme:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.yaml
        resource.leave_request.vdefault/acme.hr:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.hr.yaml
        resource.leave_request.vdefault/acme.hr.uk:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.hr.uk.yaml
    policySource:
      disk: {}
