# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Check access to scope and policy version of request and principal objects

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - check_scope_and_version
    principal:
      id: john
      roles:
        - employee
      scope: acme.hr
      policyVersion: default
      attr:
        department: marketing
        geography: GB
        team: design
        ip_address: 10.20.0.13
    resource:
      kind: leave_request
      scope: acme.hr
      policyVersion: default
      id: XX125
      attr:
        department: marketing
        geography: GB
        id: XX125
        owner: john
        team: design

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      check_scope_and_version:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr
        scope: acme.hr
    effectiveDerivedRoles:
      - employee_that_owns_the_record

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.leave_request.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_05.yaml
        resource.leave_request.vdefault/acme:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.yaml
        resource.leave_request.vdefault/acme.hr:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.hr.yaml
    policySource:
      disk: {}
