# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: "Scoped principal policy: lenient scope search"

config:
  lenientScopeSearch:
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - view:public
      - delete
    principal:
      id: donald_duck
      scope: acme.hr.france.marseille
      roles:
        - employee
      attr:
        department: marketing
        geography: GB
        team: design
        managed_geographies: GB
    resource:
      kind: salary_record
      id: XX125
      attr:
        department: marketing
        geography: GB
        id: XX125
        owner: john
        team: design

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      view:public:
        effect: EFFECT_ALLOW
        policy: principal.donald_duck.vdefault/acme.hr
        scope: acme.hr
      delete:
        effect: EFFECT_DENY
        policy: principal.donald_duck.vdefault/acme.hr
        scope: acme

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        principal.donald_duck.vdefault:
          attributes:
            driver: disk
            source: principal_policies/policy_02.yaml
        principal.donald_duck.vdefault/acme:
          attributes:
            driver: disk
            source: principal_policies/policy_02_acme.yaml
        principal.donald_duck.vdefault/acme.hr:
          attributes:
            driver: disk
            source: principal_policies/policy_02_acme.hr.yaml
    policySource:
      disk: {}
