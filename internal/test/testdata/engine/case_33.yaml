# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: No principal policy rules

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - view:public
    principal:
      id: donald_duck
      scope: acme.hr.uk
      roles:
        - employee
    resource:
      kind: salary_record
      id: XX125

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      view:public:
        effect: EFFECT_ALLOW
        policy: principal.donald_duck.vdefault/acme.hr.uk
        scope: acme.hr

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        principal.donald_duck.vdefault:
          attributes:
            driver: disk
            source: principal_policies/policy_02.yaml
        principal.donald_duck.vdefault/acme:
          attributes:
            driver: disk
            source: principal_policies/policy_02_acme.yaml
        principal.donald_duck.vdefault/acme.hr:
          attributes:
            driver: disk
            source: principal_policies/policy_02_acme.hr.yaml
    policySource:
      disk: {}
