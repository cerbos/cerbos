# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Resource policy which is narrowed by role policy defined in same scope

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - create
      - defer
    principal:
      id: john
      roles:
        - acme_london_employee
      attr:
        city: london
    resource:
      kind: leave_request
      scope: acme.hr.uk.london
      id: XX125
      attr:
        owner: john

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      create:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr.uk.london
        scope: acme
      defer:
        effect: EFFECT_DENY
        policy: role.acme_london_employee.vdefault/acme.hr.uk.london
        scope: acme.hr.uk.london
    effectiveDerivedRoles:
      - any_employee
      - employee_that_owns_the_record
    outputs:
      - src: "role.acme_london_employee.vdefault/acme.hr.uk.london#city_check"
        val: john_in_london
        action: create

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.leave_request.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_05.yaml
        resource.leave_request.vdefault/acme:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.yaml
        role.acme_london_employee.vdefault/acme.hr.uk.london:
          attributes:
            driver: disk
            source: role_policies/policy_05_acme.hr.uk.london.yaml
    policySource:
      disk: {}
