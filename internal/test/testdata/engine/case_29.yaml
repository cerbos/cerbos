# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Resource policy with REQUIRE_PARENTAL_CONSENT_FOR_ALLOWS

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      # exists, falls through, allow
      - create

      # exists, falls through, no match
      - delete

      # not narrowed in target scope, falls through, allow
      - nonaction
    principal:
      id: x001
      roles:
        - employee
    resource:
      kind: calendar_entry
      id: XX125
      scope: acme.sales

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      create:
        effect: EFFECT_ALLOW
        policy: resource.calendar_entry.vdefault/acme.sales
        scope: acme
      delete:
        effect: EFFECT_DENY
        policy: resource.calendar_entry.vdefault/acme.sales
      nonaction:
        effect: EFFECT_ALLOW
        policy: resource.calendar_entry.vdefault/acme.sales

wantDecisionLogs:
  - peer: {}
    checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.calendar_entry.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_17.yaml
        resource.calendar_entry.vdefault/acme:
          attributes:
            driver: disk
            source: resource_policies/policy_17.acme.yaml
        resource.calendar_entry.vdefault/acme.sales:
          attributes:
            driver: disk
            source: resource_policies/policy_17.acme.sales.yaml
    policySource:
      disk: {}
