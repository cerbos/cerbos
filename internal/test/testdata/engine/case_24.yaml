# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: OVERRIDE_PARENT resource policies interleaved with role policies with parent roles

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
  strictEvaluation:
    - false

inputs: &inputs
  - requestId: test
    actions:
      # allowed in named role, parent custom role and in resource policy in same scope
      - assist

      # allowed in named role, but not in parent custom role. is in resource policy but will be denied by parent custom role
      - aid

      # not allowed in named role, but is in parent custom role
      - suggest

      # allowed in named role and parent custom role and for parent role in resource policy in parent scope
      - redirect

      # allowed in `any_employee` derived role which has the `employee` parent role
      - view:public
    principal:
      id: john
      roles:
        - acme_assistant
    resource:
      kind: leave_request
      scope: acme.hr.uk
      id: XX125

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      assist:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr.uk
        scope: acme.hr.uk
      aid:
        effect: EFFECT_DENY
        policy: role.acme_travel_agent.vdefault/acme.hr.uk
        scope: acme.hr.uk
      suggest:
        effect: EFFECT_DENY
        policy: role.acme_assistant.vdefault/acme.hr.uk
        scope: acme.hr.uk
      redirect:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr.uk
        scope: acme.hr
      view:public:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr.uk
        scope: acme
    effectiveDerivedRoles:
      - any_employee
    evaluationErrors:
      - celError:
          expression: R.attr.owner == P.id
          message: "no such key: owner"

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.leave_request.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_05.yaml
        resource.leave_request.vdefault/acme:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.yaml
        resource.leave_request.vdefault/acme.hr:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.hr.yaml
        resource.leave_request.vdefault/acme.hr.uk:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.hr.uk.yaml
        role.acme_assistant.vdefault/acme.hr.uk:
          attributes:
            driver: disk
            source: role_policies/policy_03_acme.hr.uk.yaml
        role.acme_travel_agent.vdefault/acme.hr.uk:
          attributes:
            driver: disk
            source: role_policies/policy_04_acme.hr.uk.yaml
    policySource:
      disk: {}
