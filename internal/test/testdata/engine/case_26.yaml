# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Principal policy with REQUIRE_PARENTAL_CONSENT_FOR_ALLOWS

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      # ALLOW in target scope, ALLOW in parent
      - create

      # ALLOW in target scope, no match is parent principal scopes or resource scopes
      - delete

      # ALLOW in target scope, no match in parent principal scopes, match in resource policy scope
      - plan

      # no match in target scope, no match in principal policies, match in resource policy scope
      - nonaction

      # no match in target scope, match in principal policies
      - acme_action

      # Matching rule but condition not satisfied in target scope, ALLOW in parent, still DENY
      - duplicate
    principal:
      id: donald_duck
      roles:
        - employee
      scope: acme.sales
    resource:
      kind: calendar_entry
      id: XX125

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      create:
        effect: EFFECT_ALLOW
        policy: principal.donald_duck.vdefault/acme.sales
        scope: acme
      delete:
        effect: EFFECT_DENY
        policy: resource.calendar_entry.vdefault
      plan:
        effect: EFFECT_ALLOW
        policy: resource.calendar_entry.vdefault
      nonaction:
        effect: EFFECT_ALLOW
        policy: resource.calendar_entry.vdefault
      acme_action:
        effect: EFFECT_ALLOW
        policy: principal.donald_duck.vdefault/acme.sales
        scope: acme
      duplicate:
        effect: EFFECT_DENY
        policy: principal.donald_duck.vdefault/acme.sales
        scope: acme.sales
    evaluationErrors:
      - celError:
          expression: P.attr.copy_cat == true
          message: "no such key: copy_cat"

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        principal.donald_duck.vdefault:
          attributes:
            driver: disk
            source: principal_policies/policy_02.yaml
        principal.donald_duck.vdefault/acme:
          attributes:
            driver: disk
            source: principal_policies/policy_02_acme.yaml
        principal.donald_duck.vdefault/acme.sales:
          attributes:
            driver: disk
            source: principal_policies/policy_02_acme.sales.yaml
        resource.calendar_entry.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_17.yaml
    policySource:
      disk: {}
