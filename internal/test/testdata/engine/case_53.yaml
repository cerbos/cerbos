# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: CEL errors - no errors

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - principal: &principal
      id: sam
      roles:
        - user
    resource:
      kind: cel_errors.account
      id: under_threshold
      attr:
        amount: 500
    actions:
      - read
  - principal: *principal
    resource:
      kind: cel_errors.account
      id: over_threshold
      attr:
        amount: 5000
    actions:
      - read
  - principal: *principal
    resource:
      kind: cel_errors.record
      id: active_derived_role
      attr:
        amount: 5000
    actions:
      - view
  - principal: *principal
    resource:
      kind: cel_errors.record
      id: inactive_derived_role
      attr:
        amount: 500
    actions:
      - view
  - principal: *principal
    resource:
      kind: cel_errors.account
      id: error_in_allow
      attr:
        amount: "5000"
    actions:
      - write
  - principal: *principal
    resource:
      kind: cel_errors.ledger
      id: error_in_variable
      attr:
        amount: "5000"
    actions:
      - export
      - view

wantOutputs: &outputs
  - resourceId: under_threshold
    actions:
      read:
        effect: EFFECT_ALLOW
        policy: resource.cel_errors.account.vdefault
  - resourceId: over_threshold
    actions:
      read:
        effect: EFFECT_DENY
        policy: resource.cel_errors.account.vdefault
  - resourceId: active_derived_role
    actions:
      view:
        effect: EFFECT_DENY
        policy: resource.cel_errors.record.vdefault
    effectiveDerivedRoles:
      - owner
  - resourceId: inactive_derived_role
    actions:
      view:
        effect: EFFECT_ALLOW
        policy: resource.cel_errors.record.vdefault
  - resourceId: error_in_allow
    actions:
      write:
        effect: EFFECT_DENY
        policy: resource.cel_errors.account.vdefault
    evaluationErrors:
      - celError:
          expression: R.attr.amount > 1000
          message: no such overload
  - resourceId: error_in_variable
    actions:
      export:
        effect: EFFECT_DENY
        policy: resource.cel_errors.ledger.vdefault
      view:
        effect: EFFECT_ALLOW
        policy: resource.cel_errors.ledger.vdefault
    evaluationErrors:
      - celError:
          expression: R.attr.amount > 1000
          message: no such overload
      - celError:
          expression: V.v1
          message: undefined field 'v1'

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.cel_errors.account.vdefault:
          attributes:
            driver: disk
            source: resource_policies/cel_errors/account.yaml
        resource.cel_errors.ledger.vdefault:
          attributes:
            driver: disk
            source: resource_policies/cel_errors/ledger.yaml
        resource.cel_errors.record.vdefault:
          attributes:
            driver: disk
            source: resource_policies/cel_errors/record.yaml
    policySource:
      disk: {}
