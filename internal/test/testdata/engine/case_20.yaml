# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Missing attribute referenced in a variable

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false

inputs: &inputs
  - requestId: test
    actions:
      - use
    principal:
      id: abc
      roles:
        - user
      attr:
        email: info@example.com
    resource:
      kind: missing_attr
      id: test

wantOutputs: &outputs
  - requestId: test
    resourceId: test
    actions:
      use:
        effect: EFFECT_ALLOW
        policy: resource.missing_attr.vdefault
    evaluationErrors:
      - celError:
          expression: P.attr.is_engineer
          message: "no such key: is_engineer"
      - celError:
          expression: V.eng && P.attr.org == "org-1"
          message: undefined field 'eng'

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.missing_attr.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_13.yaml
    policySource:
      disk: {}
