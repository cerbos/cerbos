# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: Wildcard roles on account resource

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - create
      - delete
      - edit
    principal:
      id: john
      roles:
        - user
      attr: {}
    resource:
      policyVersion: default
      kind: account
      id: XX125
      attr: {}

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      create:
        effect: EFFECT_DENY
        policy: resource.account.vdefault
      delete:
        effect: EFFECT_ALLOW
        policy: resource.account.vdefault
      edit:
        effect: EFFECT_ALLOW
        policy: resource.account.vdefault

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.account.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_06.yaml
    policySource:
      disk: {}
