# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: John's direct manager tries to approve a draft leave request and a pending-approval leave request

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
    - ENFORCEMENT_WARN
    - ENFORCEMENT_REJECT
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test1
    actions:
      - approve
    principal:
      id: sally
      policyVersion: "20210210"
      roles:
        - employee
        - manager
      attr:
        department: marketing
        geography: GB
        team: design
        managed_geographies: GB
    resource:
      kind: leave_request
      policyVersion: "20210210"
      id: XX125
      attr:
        department: marketing
        geography: GB
        id: XX125
        owner: john
        team: design
        status: PENDING_APPROVAL
  - requestId: test2
    actions:
      - approve
    principal:
      id: sally
      policyVersion: "20210210"
      roles:
        - employee
        - manager
      attr:
        department: marketing
        geography: GB
        team: design
        managed_geographies: GB
    resource:
      kind: leave_request
      policyVersion: "20210210"
      id: XX150
      attr:
        department: marketing
        geography: GB
        id: XX150
        owner: john
        team: design
        status: DRAFT

wantOutputs: &outputs
  - requestId: test1
    resourceId: XX125
    actions:
      approve:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.v20210210
    effectiveDerivedRoles:
      - any_employee
      - direct_manager
  - requestId: test2
    resourceId: XX150
    actions:
      approve:
        effect: EFFECT_DENY
        policy: resource.leave_request.v20210210
    effectiveDerivedRoles:
      - any_employee
      - direct_manager

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.leave_request.v20210210:
          attributes:
            driver: disk
            source: resource_policies/policy_01.yaml
    policySource:
      disk: {}
