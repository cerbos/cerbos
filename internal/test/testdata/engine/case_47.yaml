# yaml-language-server: $schema=../.jsonschema/EngineTestCase.schema.json
---
description: "Schema enforcement NONE: Scoped policy: Bad department value"

config:
  lenientScopeSearch:
    - false
    - true
  schemaEnforcement:
    - ENFORCEMENT_NONE
  strictEvaluation:
    - false
    - true

inputs: &inputs
  - requestId: test
    actions:
      - view:public
      - approve
    principal:
      id: john
      scope: acme.hr
      roles:
        - employee
      attr:
        department: accounting
        geography: GB
        team: design
    resource:
      kind: leave_request
      scope: acme.hr.uk
      id: XX125
      attr:
        department: accounting
        geography: GB
        id: XX125
        owner: john
        team: design

wantOutputs: &outputs
  - requestId: test
    resourceId: XX125
    actions:
      view:public:
        effect: EFFECT_ALLOW
        policy: resource.leave_request.vdefault/acme.hr.uk
        scope: acme.hr
      approve:
        effect: EFFECT_DENY
        policy: resource.leave_request.vdefault/acme.hr.uk
    effectiveDerivedRoles:
      - employee_that_owns_the_record
      - any_employee

wantDecisionLogs:
  - checkResources:
      inputs: *inputs
      outputs: *outputs
    auditTrail:
      effectivePolicies:
        resource.leave_request.vdefault:
          attributes:
            driver: disk
            source: resource_policies/policy_05.yaml
        resource.leave_request.vdefault/acme:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.yaml
        resource.leave_request.vdefault/acme.hr:
          attributes:
            driver: disk
            source: resource_policies/policy_05_acme.hr.yaml
    policySource:
      disk: {}
